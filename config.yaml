# ===== 数据源 =====
data_source:
  stock_api: "akshare"
  retry_times: 3
  cache_dir: "./data/cache/"
  kline_keep_days: 90

# ===== 账户 =====
account:
  initial_cash: 10000
  currency: "CNY"
  fee_rate: 0.0001
  fee_min: 1.0

# ===== 风控 =====
risk:
  daily_buy_limit: 200000
  daily_trade_limit: 10
  trading_hours_only: false

# ===== 教育提示 =====
education:
  popups:
    - trigger: "first_buy"
      title: "🎓 第一次买入！"
      content: "买入前先问自己：这家公司在做什么生意？为什么选它而不是别的？把答案记下来，过段时间看看对不对。"
    - trigger: "loss_5pct"
      title: "📉 亏了5%"
      content: "市场短期波动是正常的。历史上A股任意时点持有3年，赚钱概率超过70%。关键是要选好公司、不要追涨杀跌。"
    - trigger: "fee_min"
      title: "💡 手续费小知识"
      content: "你这次因为金额太小，手续费按最低1元收。现实中买100元股票，单手续费就占了1%！所以散户要么买够金额，要么长期持有。"

# ===== 应用 =====
app:
  host: "0.0.0.0"
  port: 8088
  title: "小小投资家 · 股票+黄金模拟盘"